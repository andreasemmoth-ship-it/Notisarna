<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notiserna – nyheter och vardagsekonomi</title>
  <meta name="description" content="Dagens nyheter och korta, begripliga förklaringar om vardagsekonomi: avgifter, avtal, skatter och priser som påverkar din plånbok." />

  <!-- Open Graph / Facebook / Slack / iMessage -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://www.notiserna.se/" />
  <meta property="og:title"       content="Notiserna – nyheter och vardagsekonomi" />
  <meta property="og:description" content="Dagens nyheter och enkla förklaringar om vardagsekonomi – det som påverkar din plånbok." />
  <meta property="og:image"       content="https://www.notiserna.se/images/blogg/notiserna.jpeg" />
  <meta property="og:locale"      content="sv_SE" />
  <meta property="og:site_name"   content="Notiserna" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Notiserna – nyheter och vardagsekonomi" />
  <meta name="twitter:description" content="Dagens nyheter och enkla förklaringar om vardagsekonomi – det som påverkar din plånbok." />
  <meta name="twitter:image"       content="https://www.notiserna.se/images/blogg/notiserna.jpeg" />

  <!-- Canonical & robots -->
  <link rel="canonical" href="https://www.notiserna.se/" />
  <meta name="robots" content="index, follow" />

  <!-- Structured Data for Search Engines & AI Crawlers -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Notiserna",
      "url": "https://www.notiserna.se/",
      "description": "Dagens nyheter och enkla förklaringar om vardagsekonomi – det som påverkar din plånbok.",
      "inLanguage": "sv"
    }
  </script>

  <!-- Förhindra blixt av fel tema vid sidladdning -->
  <script>
    (function(){
      try {
        var s = localStorage.getItem('colorScheme');
        var t = s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
